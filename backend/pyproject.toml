[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]
ignore = ["DJ001", "E501"]  # long strings are fine; ruff format wraps code

[tool.ruff.lint.per-file-ignores]
"automation/tests/*" = ["S101", "S105", "S106", "S311"]
"automation/demo.py" = ["S311"]
"scripts/*" = ["S310"]
