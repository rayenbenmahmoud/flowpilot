# FlowPilot local stack: PostgreSQL + Redis + API + Celery worker + web UI.
#   cp .env.example .env   (then set FLOWPILOT_WEBHOOK_SECRET)
#   docker compose up --build
# UI: http://localhost:8080   API docs: http://localhost:8080/api/docs/
# Optional n8n for the live-integration walkthrough:  docker compose --profile n8n up
x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-flowpilot}:${POSTGRES_PASSWORD:-change-me-before-sharing}@db:5432/${POSTGRES_DB:-flowpilot}
    CELERY_BROKER_URL: redis://redis:6379/0
    REDIS_URL: redis://redis:6379/1
    FLOWPILOT_EAGER_TASKS: "false"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowpilot}
      POSTGRES_USER: ${POSTGRES_USER:-flowpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-sharing}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowpilot}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    <<: *backend-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]

  worker:
    build: ./backend
    <<: *backend-env
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      backend: { condition: service_started }

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

  n8n:
    profiles: [n8n]
    image: docker.n8n.io/n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:5678/
    volumes: [n8ndata:/home/node/.n8n]

volumes:
  pgdata:
  n8ndata:
